[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
# ⚠ THE SECOND CONSUMER, AND ITS CREDENTIAL SHAPE IS THE POINT. `the reference consumer`
# holds an OAuth2 client, a rotating refresh token AND a bearer secret - four
# values. This one holds ONE: the bearer secret the shared layer needs to open a
# listener at all. If the layer only fits the first shape it is not a shared
# layer, and until this existed nothing measured which of the two was true.
dependencies = [
  "mcp-packaging"
]
description = "The example consumer: the smallest honest MCP server the shared layer can build, package, harden and check"
license = "MIT"
name = "example-mcp"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

# ONE console script. `lib.mkServerPackage` asserts at BUILD time that the
# installed command routes through exactly this target, so a drift between the
# two is a build failure rather than a runtime surprise.
[project.scripts]
example-mcp-server = "example_mcp.entrypoint:main"

[tool.uv.sources]
mcp-packaging = {workspace = true}
