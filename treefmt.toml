allow-missing-formatter = true
verbose = 1
walk = "git"

[formatter.mdformat]
command = "mdformat"
excludes = []
includes = ["*.md"]
options = []

[formatter.nixfmt-classic]
command = "nixfmt"
excludes = []
includes = ["*.nix"]
options = []

[formatter.ruff-check]
command = "ruff"
excludes = []
includes = ["*.py", "*.pyi"]
options = ["check", "--fix"]

[formatter.ruff-format]
command = "ruff"
excludes = []
includes = ["*.py", "*.pyi"]
options = ["format"]

[formatter.toml-sort]
command = "toml-sort"
excludes = []
includes = ["*.toml"]
options = ["-i"]

# yamlfmt unwraps folded block scalars onto one line and drops the blank lines
# between top-level keys. That is harmless for machine-written YAML and wrong for
# the YAML a person reads here: the wave records under docs/, whose notes are
# hand-wrapped prose. Excluded so that running treefmt over the repository is
# safe, which is what makes it usable as a gate.
[formatter.yamlfmt]
command = "yamlfmt"
excludes = ["docs/**/*.yaml", "docs/**/*.yml", ".github/workflows/*.yml"]
includes = ["*.yaml", "*.yml"]
options = []
