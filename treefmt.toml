allow-missing-formatter = true
verbose = 1
walk = "git"

[formatter.mdformat]
command = "mdformat"
excludes = []
includes = ["*.md"]
options = []

# ⚠ NAMED `nixfmt`, NOT `nixfmt-classic`, AND THE NAME IS LOAD-BEARING. The
# reference repository's config declares the formatter under the section name
# `nixfmt-classic` while its shell supplies `pkgs.nixfmt` - the RFC-style tool -
# and the whole tree is written in RFC style. treefmt takes the BINARY from
# `command`, so that config happened to be correct only as long as the binary on
# PATH was the RFC one; run with `nixfmt-classic` genuinely on PATH and it
# reflows every Nix file in the repository into the pre-RFC style. With
# `allow-missing-formatter = true` above, a box without the tool reports clean
# either way, so nothing ever said which style the tree was in.
[formatter.nixfmt]
command = "nixfmt"
excludes = []
includes = ["*.nix"]
options = []

[formatter.ruff-check]
command = "ruff"
excludes = []
includes = ["*.py", "*.pyi"]
options = ["check", "--fix"]

[formatter.ruff-format]
command = "ruff"
excludes = []
includes = ["*.py", "*.pyi"]
options = ["format"]

[formatter.toml-sort]
command = "toml-sort"
excludes = []
includes = ["*.toml"]
options = ["-i"]

# yamlfmt unwraps folded block scalars onto one line and drops the blank lines
# between top-level keys. That is harmless for machine-written YAML and wrong for
# the YAML a person reads here: the wave records under docs/, whose notes are
# hand-wrapped prose. Excluded so that running treefmt over the repository is
# safe, which is what makes it usable as a gate.
[formatter.yamlfmt]
command = "yamlfmt"
excludes = ["docs/**/*.yaml", "docs/**/*.yml", ".github/workflows/*.yml"]
includes = ["*.yaml", "*.yml"]
options = []
